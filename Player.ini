[Rainmeter]
Update=100
BackgroundMode=1
AccurateText=1
SkinHeight=([MeterBackground:H]+15)
DynamicWindowSize=1

[Variables]
FontName=Kanit
BgColor=0,0,0,94
TextColor=255,255,255
SubTextColor=170,170,170
ControlColor=255,255,255,180
ControlHoverColor=255,50,50
BarColorStart=255,30,100
BarColorEnd=255,110,60
SkinWidth=180
CornerRadius=15

; --- Measures ---

[MeasurePlayer]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Status

[MeasureState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
IfCondition=MeasureState = 1
IfTrueAction=[!SetOption MeterPlayPause Text "[\xE769]"][!UpdateMeter *][!Redraw]
IfFalseAction=[!SetOption MeterPlayPause Text "[\xE768]"][!UpdateMeter *][!Redraw]

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
Substitute="":"No Track"
; --- จุดสำคัญ: เมื่อเปลี่ยนเพลง ให้รีเซ็ตเวลาเป็น 0 ทันที ---
OnChangeAction=[!CommandMeasure MeasurePlayer "SetPosition 0"][!UpdateMeasure *][!UpdateMeter *][!Redraw]

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
Substitute="":"Unknown Artist"

[MeasureCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover
DefaultPath=#@#Images\nocover.png

[MeasurePosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position
Substitute="":"0:00"

[MeasureDuration]
Measure=Plugin
Plugin=WebNowPlaying
; ระบุ PlayerName เพื่อให้ดึงความยาวเพลงนั้นๆ ได้แม่นยำ
PlayerName=[MeasurePlayer]
PlayerType=Duration
Substitute="":"0:00"

[MeasureProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress

; --- UI Elements ---

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,(#SkinWidth#+30),([MeterPlayPause:Y]+45),#CornerRadius# | Fill Color #BgColor# | StrokeWidth 0
DynamicVariables=1

[MeterCover]
Meter=Image
MeasureName=MeasureCover
W=180
H=180
X=15
Y=15
AntiAlias=1
PreserveAspectRatio=1

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=((#SkinWidth#+30)/2)
Y=10R
W=180
FontSize=12
FontFace=#FontName#
FontColor=#TextColor#
StringStyle=Bold
StringAlign=Center
ClipString=1
AntiAlias=1
InlineSetting=Shadow | 1 | 1 | 2 | 0,0,0,200

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=((#SkinWidth#+30)/2)
Y=2R
W=180
FontSize=8
FontFace=#FontName#
FontColor=#SubTextColor#
StringAlign=Center
ClipString=1
AntiAlias=1
InlineSetting=Shadow | 1 | 1 | 1 | 0,0,0,200

; --- Progress Bar (Static) ---

[MeterProgressBarBack]
Meter=Shape
X=15
Y=12R
Shape=Rectangle 0,0,#SkinWidth#,4,2 | Fill Color 255,255,255,50 | StrokeWidth 0

[MeterProgressBar]
Meter=Shape
X=0r
Y=0r
Shape=Rectangle 0,0,(#SkinWidth#*([MeasureProgress]/100)),4,2 | Fill LinearGradient BarGradient | StrokeWidth 0
BarGradient=180 | #BarColorStart# ; 0.0 | #BarColorEnd# ; 1.0
DynamicVariables=1

; --- Time Display ---

[MeterTimePosition]
Meter=String
MeasureName=MeasurePosition
X=15
Y=5R
FontSize=10
FontFace=#FontName#
FontColor=#TextColor#
StringAlign=Left
AntiAlias=1
DynamicVariables=1
InlineSetting=Shadow | 1 | 1 | 1 | 0,0,0,200

[MeterTimeDuration]
Meter=String
MeasureName=MeasureDuration
X=(#SkinWidth#+15)
Y=0r
FontSize=10
FontFace=#FontName#
FontColor=#TextColor#
StringAlign=Right
AntiAlias=1
DynamicVariables=1
InlineSetting=Shadow | 1 | 1 | 1 | 0,0,0,200

; --- Controls ---

[MeterPlayPause]
Meter=String
X=((#SkinWidth#+30)/2)
Y=5R
FontSize=16
FontFace=Segoe MDL2 Assets
FontColor=#TextColor#
StringAlign=Center
Text=[\xE768]
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "PlayPause"]
MouseOverAction=[!SetOption MeterPlayPause FontColor #ControlHoverColor#][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetOption MeterPlayPause FontColor #TextColor#][!UpdateMeter *][!Redraw]
AntiAlias=1

[MeterPrev]
Meter=String
X=-45r
Y=2r
FontSize=12
FontFace=Segoe MDL2 Assets
FontColor=#ControlColor#
StringAlign=Center
Text=[\xE892]
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "Previous"]
AntiAlias=1

[MeterNext]
Meter=String
X=90r
Y=0r
FontSize=12
FontFace=Segoe MDL2 Assets
FontColor=#ControlColor#
StringAlign=Center
Text=[\xE893]
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "Next"]
AntiAlias=1